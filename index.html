<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rad Eye INC — Login</title>
<style>
:root {
    --panel-bg: rgba(5,10,25,.95);
    --neon-cyan: #00f3ff;
    --neon-pink: #ff0055;
    --neon-green: #00ff66;
    --text-color: #c0d1ff;
    --btn-gradient: linear-gradient(135deg,#00f3ff,#7b00ff);
    --btn-hover-gradient: linear-gradient(135deg,#00ffb7,#00f3ff);
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Courier New",monospace;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(120deg,#020617,#1e0033,#002b3d,#33001a,#001a33);
    background-size: 500% 500%;
    animation: hyperGradient 6s ease infinite;
    color: var(--text-color);
    position: relative;
    overflow-x: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.3) 50%);
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 1;
}
@keyframes hyperGradient {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}
.login-wrapper {
    position: relative;
    width: 460px;
    padding: 3px;
    z-index: 2;
    background: linear-gradient(90deg,transparent,var(--neon-cyan),transparent);
    background-size: 200% 100%;
    animation: borderLight 3s linear infinite;
    clip-path: polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));
}
@keyframes borderLight {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}
.login-panel {
    width: 100%;
    background: var(--panel-bg);
    padding: 26px;
    clip-path: polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--neon-cyan);
    padding-bottom: 10px;
    margin-bottom: 18px;
}
.header {
    color: var(--neon-cyan);
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.language-box {
    position: relative;
}
.language-btn {
    background: transparent;
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    padding: 5px 8px;
    cursor: pointer;
    font-size: 14px;
    transition: .3s;
}
.language-btn:hover {
    background: var(--neon-cyan);
    color: #050814;
    box-shadow: 0 0 12px var(--neon-cyan);
}
.language-menu {
    position: absolute;
    top: 34px;
    right: 0;
    width: 82px;
    background: rgba(5,10,25,.98);
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 15px rgba(0,243,255,.4);
    display: none;
    z-index: 10;
}
.language-menu.show {
    display: block;
}
.language-option {
    width: 100%;
    padding: 8px;
    background: transparent;
    border: none;
    color: var(--text-color);
    cursor: pointer;
    text-align: left;
    font-size: 12px;
}
.language-option:hover {
    background: rgba(0,243,255,.15);
    color: var(--neon-cyan);
}
.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}
.tab-btn {
    flex: 1;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--text-color);
    color: var(--text-color);
    cursor: pointer;
    text-transform: uppercase;
    font-size: 12px;
    transition: .3s;
}
.tab-btn:hover,.tab-btn.active {
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
}
.tab-btn.active {
    background: rgba(0,243,255,.15);
    box-shadow: 0 0 10px rgba(0,243,255,.3);
}
.form-group {
    margin-bottom: 14px;
}
label {
    display: block;
    color: var(--neon-cyan);
    font-size: 11px;
    margin-bottom: 5px;
    text-transform: uppercase;
    text-align: left;
}
input[type="text"],
input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 10px;
    background: rgba(0,0,0,.6);
    border: 1px solid var(--text-color);
    color: var(--neon-cyan);
    outline: none;
    font-size: 14px;
    transition: .3s;
}
input::placeholder {
    color: rgba(192,209,255,.45);
}
input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 10px rgba(0,243,255,.6);
}
.show-password {
    margin-top: 7px;
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-color);
    font-size: 12px;
    cursor: pointer;
    text-transform: none;
}
.show-password input {
    width: 14px;
    height: 14px;
    accent-color: var(--neon-cyan);
}
.action-btn {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    border: none;
    background: var(--btn-gradient);
    color: white;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
    box-shadow: 0 0 15px rgba(123,0,255,.4);
}
.action-btn:hover {
    background: var(--btn-hover-gradient);
    color: #050814;
    box-shadow: 0 0 25px rgba(0,243,255,.8);
    transform: translateY(-1px);
}
.status {
    min-height: 25px;
    margin-top: 15px;
    font-size: 13px;
    text-align: left;
}
.success {
    color: var(--neon-green);
    text-shadow: 0 0 10px var(--neon-green);
}
.error {
    color: var(--neon-pink);
    text-shadow: 0 0 10px var(--neon-pink);
}
.hidden {
    display: none !important;
}
.terminal-header {
    margin-top: 16px;
    padding-top: 10px;
    border-top: 1px dashed var(--neon-cyan);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.system-name {
    color: var(--neon-cyan);
    font-size: 10px;
    letter-spacing: 1px;
}
.support-btn {
    background: transparent;
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    font-size: 10px;
    padding: 4px 7px;
    cursor: pointer;
    transition: .3s;
}
.support-btn:hover {
    background: var(--neon-cyan);
    color: #050814;
    box-shadow: 0 0 8px var(--neon-cyan);
}
.support-modal {
    margin-top: 12px;
    border: 1px dashed var(--neon-pink);
    padding: 12px;
    background: rgba(0,0,0,.8);
}
.modal-header {
    color: var(--neon-pink);
    font-size: 11px;
    border-bottom: 1px dashed var(--neon-pink);
    padding-bottom: 6px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
}
.modal-body {
    font-size: 10px;
    line-height: 1.4;
    color: var(--text-color);
}
.modal-body ul {
    margin-left: 14px;
    margin-top: 6px;
}
.modal-body li {
    margin-bottom: 6px;
}
@media (max-width:500px) {
    .login-wrapper {
        width: 92%;
    }
    .login-panel {
        padding: 20px;
    }
}
</style>
</head>
<body>
<div class="login-wrapper">
<div class="login-panel">
<div class="top-bar">
<div class="header">Rad Eye INC</div>
<div class="language-box">
<button type="button" class="language-btn" onclick="toggleLanguageMenu()">🌐</button>
<div id="languageMenu" class="language-menu">
<button type="button" class="language-option" onclick="setLanguage('uk')">🇺🇦 UA</button>
<button type="button" class="language-option" onclick="setLanguage('en')">🇬🇧 ENG</button>
</div>
</div>
</div>
<div class="tabs">
<button type="button" id="registerTab" class="tab-btn active" onclick="switchTab('register')"><span data-uk="Реєстрація" data-en="Register">Реєстрація</span></button>
<button type="button" id="loginTab" class="tab-btn" onclick="switchTab('login')"><span data-uk="Вхід" data-en="Login">Вхід</span></button>
</div>
<div id="registerForm">
<div class="form-group">
<label for="firstName"><span data-uk="Ім'я:" data-en="First Name:">Ім'я:</span></label>
<input type="text" id="firstName" placeholder="Введіть ім'я" data-placeholder-uk="Введіть ім'я" data-placeholder-en="Enter first name">
</div>
<div class="form-group">
<label for="lastName"><span data-uk="Прізвище:" data-en="Last Name:">Прізвище:</span></label>
<input type="text" id="lastName" placeholder="Введіть прізвище" data-placeholder-uk="Введіть прізвище" data-placeholder-en="Enter last name">
</div>
<div class="form-group">
<label for="email"><span data-uk="Електронна пошта:" data-en="Email:">Електронна пошта:</span></label>
<input type="email" id="email" placeholder="example@email.com">
</div>
<div class="form-group">
<label for="regPassword"><span data-uk="Пароль:" data-en="Password:">Пароль:</span></label>
<input type="password" id="regPassword" placeholder="Введіть пароль" data-placeholder-uk="Введіть пароль" data-placeholder-en="Enter password">
<label class="show-password">
<input type="checkbox" id="showRegPassword">
<span data-uk="Показати пароль" data-en="Show password">Показати пароль</span>
</label>
</div>
<button type="button" class="action-btn" onclick="registerUser()"><span data-uk="Створити акаунт" data-en="Create Account">Створити акаунт</span></button>
</div>
<div id="loginForm" class="hidden">
<div class="form-group">
<label for="loginEmail"><span data-uk="Електронна пошта:" data-en="Email:">Електронна пошта:</span></label>
<input type="email" id="loginEmail" placeholder="example@email.com">
</div>
<div class="form-group">
<label for="loginPassword"><span data-uk="Пароль:" data-en="Password:">Пароль:</span></label>
<input type="password" id="loginPassword" placeholder="Введіть пароль" data-placeholder-uk="Введіть пароль" data-placeholder-en="Enter password">
<label class="show-password">
<input type="checkbox" id="showLoginPassword">
<span data-uk="Показати пароль" data-en="Show password">Показати пароль</span>
</label>
</div>
<button type="button" class="action-btn" onclick="loginUser()"><span data-uk="Увійти" data-en="Verify Access">Увійти</span></button>
</div>
<div id="status" class="status"></div>
<div class="terminal-header">
<span class="system-name">RAD_EYE_INC // SYSTEM</span>
<button type="button" class="support-btn" onclick="toggleSupport()"><span data-uk="Підтримка" data-en="Support">Підтримка</span></button>
</div>
<div id="supportModal" class="support-modal hidden">
<div class="modal-header">
<span>// SYSTEM_HELP.LOG</span>
<span>[HELP]</span>
</div>
<div class="modal-body">
<p data-uk="Стан системи та значення помилок:" data-en="System Status & Error Meanings:">Стан системи та значення помилок:</p>
<ul>
<li><span class="error" data-uk="✖ Помилка: порожні поля" data-en="✖ Error: Empty fields">✖ Помилка: порожні поля</span></li>
<li><span class="error" data-uk="✖ Акаунт не знайдено" data-en="✖ Error: Account not found">✖ Акаунт не знайдено</span></li>
<li><span class="error" data-uk="✖ Доступ заборонено" data-en="✖ Access Denied">✖ Доступ заборонено</span></li>
<li><span class="success" data-uk="✔ Дані збережено локально" data-en="✔ Data Saved Locally">✔ Дані збережено локально</span></li>
<li><span class="success" data-uk="✔ Доступ дозволено" data-en="✖ Access Granted">✔ Доступ дозволено</span></li>
</ul>
</div>
</div>
</div>
</div>
<script>
let currentLanguage = localStorage.getItem("rad_eye_language") || "uk";
const statusBox = document.getElementById("status");
const regPassword = document.getElementById("regPassword");
const loginPassword = document.getElementById("loginPassword");

document.getElementById("showRegPassword").addEventListener("change",function() {
    regPassword.type = this.checked ? "text" : "password";
});
document.getElementById("showLoginPassword").addEventListener("change",function() {
    loginPassword.type = this.checked ? "text" : "password";
});
function toggleLanguageMenu() {
    document.getElementById("languageMenu").classList.toggle("show");
}
function setLanguage(language) {
    currentLanguage = language;
    localStorage.setItem("rad_eye_language",language);
    document.documentElement.lang = language === "uk" ? "uk" : "en";
    document.querySelectorAll("[data-uk][data-en]").forEach(element => {
        element.textContent = language === "uk" ? element.dataset.uk : element.dataset.en;
    });
    document.querySelectorAll("[data-placeholder-uk][data-placeholder-en]").forEach(element => {
        element.placeholder = language === "uk" ? element.dataset.placeholderUk : element.dataset.placeholderEn;
    });
    document.getElementById("languageMenu").classList.remove("show");
    statusBox.textContent = "";
    statusBox.className = "status";
}
function switchTab(tab) {
    const registerForm = document.getElementById("registerForm");
    const loginForm = document.getElementById("loginForm");
    const registerTab = document.getElementById("registerTab");
    const loginTab = document.getElementById("loginTab");
    statusBox.textContent = "";
    statusBox.className = "status";
    if (tab === "register") {
        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
        registerTab.classList.add("active");
        loginTab.classList.remove("active");
    } else {
        registerForm.classList.add("hidden");
        loginForm.classList.remove("hidden");
        registerTab.classList.remove("active");
        loginTab.classList.add("active");
    }
}
function registerUser() {
    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = regPassword.value;
    if (!firstName || !lastName || !email || !password) {
        showStatus(currentLanguage === "uk" ? "✖ Помилка: заповніть усі поля" : "✖ Error: Empty fields",false);
        return;
    }
    if (!email.includes("@")) {
        showStatus(currentLanguage === "uk" ? "✖ Помилка: неправильний email" : "✖ Error: Invalid email",false);
        return;
    }
    if (password.length < 4) {
        showStatus(currentLanguage === "uk" ? "✖ Пароль має містити мінімум 4 символи" : "✖ Password must contain at least 4 characters",false);
        return;
    }
    localStorage.setItem("rad_eye_inc_account",JSON.stringify({
        firstName,
        lastName,
        email,
        password
    }));
    showStatus(currentLanguage === "uk" ? "✔ Дані успішно збережено" : "✔ Data Saved Locally",true);
}
function loginUser() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = loginPassword.value;
    if (!email || !password) {
        showStatus(currentLanguage === "uk" ? "✖ Помилка: заповніть усі поля" : "✖ Error: Empty fields",false);
        return;
    }
    const savedAccount = localStorage.getItem("rad_eye_inc_account");
    if (!savedAccount) {
        showStatus(currentLanguage === "uk" ? "✖ Акаунт не знайдено" : "✖ Error: Account not found",false);
        return;
    }
    const account = JSON.parse(savedAccount);
    if (email === account.email && password === account.password) {
        showStatus(currentLanguage === "uk" ? "✔ Доступ дозволено — Вітаємо, " + account.firstName + "!" : "✔ Access Granted — Welcome, " + account.firstName + "!",true);
    } else {
        showStatus(currentLanguage === "uk" ? "✖ Доступ заборонено" : "✖ Access Denied",false);
    }
}
function showStatus(message,success) {
    statusBox.textContent = message;
    statusBox.className = success ? "status success" : "status error";
}
function toggleSupport() {
    document.getElementById("supportModal").classList.toggle("hidden");
}
document.addEventListener("click",function(event) {
    const languageBox = document.querySelector(".language-box");
    if (!languageBox.contains(event.target)) {
        document.getElementById("languageMenu").classList.remove("show");
    }
});
setLanguage(currentLanguage);
</script>
